# Deploys the image worker (pipeline/modal_app.py) to Modal and points the
# Supabase `jobs` Edge Function at it. Runs on pushes that change the
# pipeline, or by hand from the Actions tab.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET, SUPABASE_ACCESS_TOKEN,
#   SUPABASE_PROJECT_REF, GEMINI_API_KEY
name: Deploy worker

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-d7f4130f-omb8s2, claude/project-thread-jmtb52]
    paths: [pipeline/**, .github/workflows/deploy-worker.yml, .github/scripts/deploy_worker.py]

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install modal
      - run: python .github/scripts/deploy_worker.py
